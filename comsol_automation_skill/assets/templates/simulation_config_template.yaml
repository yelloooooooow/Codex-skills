{
  "project": {
    "name": "generic_simulation",
    "description": "Generic COMSOL automation case",
    "mode": "full_workflow",
    "output_dir": "artifacts/generic_simulation"
  },
  "comsol": {
    "server_host": "localhost",
    "server_port": 2036,
    "use_existing_server": true,
    "model_name": "GenericModel",
    "model_file": null,
    "connect_timeout_s": 30,
    "cleanup_policy": "keep_current_model"
  },
  "java_migration": {
    "enabled": false,
    "source_dir": "java_src",
    "output_dir": "artifacts/java_migration",
    "sanitize_before_analysis": true,
    "keep_original_java": false,
    "generate_mapping_report": true
  },
  "geometry": {"dimension": "2d", "length_unit": "m", "primitives": [], "operations": [], "selections": {}},
  "materials": [],
  "parameters": {},
  "variables": {},
  "physics": {"enabled": {}},
  "mesh": {"mode": "physics_controlled", "size": "normal"},
  "solver": {"study_type": "time_dependent"},
  "export": {"csv": true, "png": true, "field_data": false, "keyframes": true, "animations": false, "report": true},
  "validation": {"enabled": false, "reference_data": null, "metrics": ["RMSE", "NRMSE", "endpoint_error", "trend_agreement"]},
  "privacy": {"sanitize_outputs": true, "strip_metadata": true, "scan_before_finish": true}
}
